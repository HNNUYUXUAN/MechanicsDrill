  <circle cx="180" cy="160" r="34" fill="#f4f6f7" stroke="#315369" stroke-width="3"/>
  <circle cx="390" cy="160" r="34" fill="#f4f6f7" stroke="#315369" stroke-width="3"/>
  <text x="170" y="169" font-size="24">A</text><text x="380" y="169" font-size="24">B</text>
