<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">半球形碗中均质棒的受力分析示意图</title><desc id="desc">半球截面、棒内段弦长 c、棒与水平夹角 theta、内壁法向力 N1、碗缘支持力 N2 和重力 G。</desc><rect width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 z" fill="#315369" />
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 z" fill="#b4232c" />
  </marker>
  <style>
    .line{stroke:#202020;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#626262;stroke-width:1.8;fill:none}
    .dash{stroke:#888;stroke-width:1.8;fill:none;stroke-dasharray:8 7}
    .force{stroke:#315369;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .weight{stroke:#b4232c;stroke-width:3;fill:none;marker-end:url(#arrow-red)}
    .label{font-family:'Times New Roman',serif;font-size:24px;fill:#202020}
    .small{font-family:'Times New Roman',serif;font-size:20px;fill:#626262}
    .caption{font-family:SimSun,'Songti SC',serif;font-size:19px;fill:#626262}
  </style>
</defs>
  <path d="M100 280 A150 150 0 0 0 400 280" class="line" />
  <line x1="100" y1="280" x2="400" y2="280" class="thin" />
  <circle cx="250" cy="280" r="4" fill="#202020" />
  <text x="232" y="264" class="label">O</text>
  <line x1="175" y1="410" x2="475" y2="237" class="line" />
  <circle cx="175" cy="410" r="5" fill="#202020" />
  <circle cx="400" cy="280" r="5" fill="#202020" />
  <text x="153" y="438" class="label">P</text><text x="414" y="286" class="label">Q</text><text x="487" y="230" class="label">B</text>
  <line x1="175" y1="410" x2="250" y2="280" class="thin" />
  <text x="197" y="330" class="small">r</text>
  <line x1="175" y1="410" x2="238" y2="301" class="force" />
  <text x="188" y="295" class="label">N₁</text>
  <line x1="400" y1="280" x2="350" y2="194" class="force" />
  <text x="318" y="187" class="label">N₂</text>
  <line x1="325" y1="324" x2="325" y2="397" class="weight" />
  <text x="339" y="403" class="label" fill="#b4232c">G</text>
  <line x1="175" y1="410" x2="400" y2="280" class="dash" />
  <text x="277" y="365" class="small">c</text>
  <line x1="400" y1="280" x2="475" y2="280" class="thin" />
  <path d="M455 280 A55 55 0 0 0 447 252" class="thin" />
  <text x="462" y="257" class="label">θ</text>
</svg>