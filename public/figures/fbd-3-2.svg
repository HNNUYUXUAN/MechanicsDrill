<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">斜靠在光滑棱角上的均质棒受力分析图</title><desc id="desc">墙面 A 点水平反力，棱角 P 点垂直于杆的支持力，杆中点重力。</desc><rect width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
